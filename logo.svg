<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1976D2"/>
      <stop offset="100%" stop-color="#0D47A1"/>
    </linearGradient>
  </defs>

  <!-- Handle -->
  <line x1="340" y1="340" x2="490" y2="490" stroke="#0D47A1" stroke-width="50" stroke-linecap="round"/>

  <!-- Ring -->
  <circle cx="210" cy="210" r="175" fill="url(#ring)"/>
  <circle cx="210" cy="210" r="148" fill="white"/>

  <!-- House — large, fills the glass -->
  <g transform="translate(210, 205)">
    <!-- Roof -->
    <polygon points="0,-105 -95,-20 95,-20" fill="#1976D2"/>
    <!-- Wall -->
    <rect x="-70" y="-20" width="140" height="95" fill="#E3F2FD"/>
    <!-- Door -->
    <rect x="-14" y="22" width="28" height="53" rx="3" fill="#1976D2"/>
    <!-- Windows -->
    <rect x="-54" y="4" width="28" height="28" rx="3" fill="#1976D2" opacity="0.6"/>
    <rect x="26" y="4" width="28" height="28" rx="3" fill="#1976D2" opacity="0.6"/>
  </g>

  <!-- Percent badge — larger, with white border -->
  <circle cx="350" cy="68" r="50" fill="white"/>
  <circle cx="350" cy="68" r="44" fill="#FF6F00"/>
  <text x="350" y="83" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="44" fill="white">%</text>
</svg>
